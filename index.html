<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<title>Audio Visualizer</title>

<style>
body{
  background:#1e1e1e;
  color:#f3f3f3;
}

.nb-page-title{
  font-weight:600;
}

.nb-card-dark{
  background:#252525;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  color:#f3f3f3;
}

.nb-audio-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.15em;
  opacity:.7;
  margin-bottom:10px;
}

#audioFile{
  width:100%;
  margin-bottom:12px;
}

.nb-audio-play{
  width:100%;
  border:1px solid rgba(255,255,255,.15);
  background:#1e1e1e;
  color:#f3f3f3;
  padding:10px;
  border-radius:10px;
}

.nb-audio-play:hover{
  background:#2a2a2a;
}

.nb-audio-col{
  display:flex;
  align-items:center;
}

.viz-wrapper{
  width:100%;
  max-width:900px;
  height:560px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto;
}

.viz-canvas{
  display:block;
  width:100%;
  height:100%;
  background:#1e1e1e;
}

@media (max-width: 991px){
  .nb-audio-col{
    align-items:stretch;
  }

  .viz-wrapper{
    height:480px;
  }
}

@media (max-width: 640px){
  .viz-wrapper{
    height:380px;
  }
}
</style>
</head>

<body>
<div class="d-flex justify-content-center align-items-center flex-column min-vh-100 py-5">

  <h1 class="mb-4 nb-page-title">Audio Visualizer</h1>

  <div class="container">
    <div class="row justify-content-center align-items-center g-4">

      <div class="col-12 col-lg-3 nb-audio-col">
        <div class="card p-3 text-center nb-card-dark w-100">
          <label class="nb-audio-label">Audio Input</label>
          <input id="audioFile" type="file" accept="audio/*" />
          <button id="audioPlay" class="nb-audio-play">▶︎ Play</button>
          <audio id="audio" crossorigin="anonymous"></audio>
        </div>
      </div>

      <div class="col-12 col-lg-7">
        <div class="viz-wrapper">
          <canvas id="viz" class="viz-canvas"></canvas>
        </div>
      </div>

    </div>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
