<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="stylesheet" href="style.css">
  <title>Ambient Visualizer</title>
</head>

<body>
  <div class="d-flex justify-content-center align-items-center flex-column vh-100 bg-light">
    <h1 class="mb-3">Ambient Visualizer</h1>

    <div class="container">
      <div class="row justify-content-center">

        <!-- Left Column -->
        <div class="col-3">
          <div class="card p-3 shadow-sm text-center h-100 cardbackgroundSide" style="border-radius: 25px;">
            <div class="viz-meta text-center mt-3">
              <h3>Local Time & Weather:</h3>
              <div id="viz-time">--:--</div>
              <div id="viz-temp">Loading weather…</div>
            </div>

          </div>
        </div>

        <!-- Center Column -->
        <div class="col-5">
          <div class="card p-4 shadow-sm d-flex h-100 cardbackground" style="border-radius: 25px;">

            <!-- Square Visualizer -->
            <div class="viz-wrap mx-auto">
              <canvas id="viz"></canvas>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

  <!-- Visualizer logic -->
  <script src="script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
</body>

</html>
