<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- Import map MUST be in head -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <title>Audio Visualizer</title>
</head>

<body>
  <div class="d-flex justify-content-center align-items-center flex-column vh-100 bg-light">
    <h1 class="mb-3">Audio Visualizer</h1>

    <div class="container">
      <div class="row justify-content-center">

        <div class="col-3">
          <div class="card p-3 shadow-sm text-center h-100 cardbackgroundSide">

            <br>

            <div class="nb-audio-ui">
              <label class="nb-audio-label">Audio Input</label>

              <input id="audioFile" type="file" accept="audio/*" />

              <button id="audioPlay" class="nb-audio-play">
                ▶︎ Play
              </button>

              <audio id="audio" crossorigin="anonymous"></audio>
            </div>

          </div>
        </div>

        <div class="col-5">
          <div class="card card2 p-4 shadow-sm cardbackground">
            <canvas id="viz" class="viz-canvas"></canvas>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
